[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentpreflight"
version = "0.1.0"
description = "Static preflight scanner for MCP servers and agent skills"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "skysavv", email = "watermelonhedge07@gmail.com"}]
requires-python = ">=3.11"
keywords = [
    "mcp", "security", "agent", "preflight", "sast",
    "llm", "prompt-injection", "tool-poisoning", "sarif",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
]

[project.urls]
Homepage = "https://github.com/mohanish3/AgentPreflightSec"
Repository = "https://github.com/mohanish3/AgentPreflightSec"
Issues = "https://github.com/mohanish3/AgentPreflightSec/issues"

[project.scripts]
agentpreflight = "agentpreflight.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "jsonschema>=4",
    "httpx>=0.27",
    "fastapi>=0.115",
]

api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

codex = [
    "openai>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
