name: AgentPreflight Security Gate

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run AgentPreflight
        uses: ./
        with:
          target: .
          profile: strict
          fail-on: high
          sarif-file: agentpreflight.sarif
          comment-file: agentpreflight-comment.md

      - name: Upload PR scorecard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentpreflight-comment
          path: agentpreflight-comment.md

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: agentpreflight.sarif
          category: agentpreflight
