[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentpreflight"
version = "0.1.0"
description = "Static preflight scanner for MCP servers and agent skills"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "fastapi>=0.115",
]

[project.scripts]
agentpreflight = "agentpreflight.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "jsonschema>=4",
    "httpx>=0.27",
]

api = [
    "uvicorn>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
