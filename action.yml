name: AgentPreflight
description: Offline MCP and agent-skill preflight scanner with SARIF output
inputs:
  target:
    description: Path to scan
    required: false
    default: .
  profile:
    description: Scan profile
    required: false
    default: strict
  fail-on:
    description: Severity threshold that fails the job
    required: false
    default: high
  sarif-file:
    description: SARIF output path
    required: false
    default: agentpreflight.sarif
  comment-file:
    description: Markdown scorecard output path
    required: false
    default: agentpreflight-comment.md
runs:
  using: composite
  steps:
    - name: Install AgentPreflight
      shell: bash
      run: python -m pip install .
    - name: Write SARIF report
      shell: bash
      run: |
        agentpreflight scan "${{ inputs.target }}" \
          --profile "${{ inputs.profile }}" \
          --format sarif \
          --output "${{ inputs.sarif-file }}"
    - name: Write PR scorecard and enforce gate
      shell: bash
      run: |
        agentpreflight scan "${{ inputs.target }}" \
          --profile "${{ inputs.profile }}" \
          --format markdown \
          --output "${{ inputs.comment-file }}" \
          --fail-on "${{ inputs.fail-on }}"
